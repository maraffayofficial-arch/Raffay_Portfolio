<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cyberpunk Portfolio — Wireframes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #e9e8e1; font-family: 'JetBrains Mono', monospace; }
  * { box-sizing: border-box; }
  @keyframes wf-rain { 0% { transform: translateY(0); } 100% { transform: translateY(200vh); } }
  @keyframes wf-blink { 50% { opacity: 0; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wireframes.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "animationIntensity": 1,
  "accent": "#ff2e3e",
  "accent2": "#2e7bff"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweaks] = useTweaks(TWEAK_DEFAULTS);
  const intensity = tweaks.animationIntensity;

  React.useEffect(() => {
    document.documentElement.style.setProperty('--wf-accent', tweaks.accent);
    document.documentElement.style.setProperty('--wf-accent-2', tweaks.accent2);
  }, [tweaks.accent, tweaks.accent2]);

  return (
    <>
      <DesignCanvas title="A. Raffay — portfolio wireframes" subtitle="neon noir · four directions · low-fi">
        <DCSection id="sec-main" title="Directions">
          <DCArtboard id="wf1" label="WF1 · Classic vertical scroll" width={1200} height={1900}>
            <WF1 intensity={intensity} />
          </DCArtboard>
          <DCArtboard id="wf2" label="WF2 · Terminal single-screen" width={1200} height={900}>
            <WF2 intensity={intensity} />
          </DCArtboard>
          <DCArtboard id="wf3" label="WF3 · Split HUD (fixed profile + feed)" width={1200} height={1120}>
            <WF3 intensity={intensity} />
          </DCArtboard>
          <DCArtboard id="wf4" label="WF4 · Night-city grid (bento)" width={1200} height={900}>
            <WF4 intensity={intensity} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Motion">
          <TweakRadio
            label="Animation intensity"
            value={tweaks.animationIntensity}
            onChange={(v) => setTweaks({ animationIntensity: Number(v) })}
            options={[
              { label: 'Off', value: 0 },
              { label: 'Subtle', value: 1 },
              { label: 'Heavy', value: 2 },
            ]}
          />
        </TweakSection>
        <TweakSection title="Accent — Red">
          <TweakColor
            label="Primary (red)"
            value={tweaks.accent}
            onChange={(v) => setTweaks({ accent: v })}
          />
          <div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>
            {['#ff2e3e', '#ff3a5c', '#e01030', '#ff6a00', '#ff3cac'].map(c => (
              <button
                key={c}
                onClick={() => setTweaks({ accent: c })}
                style={{ width: 22, height: 22, border: '1px solid #333', background: c, cursor: 'pointer' }}
              />
            ))}
          </div>
        </TweakSection>
        <TweakSection title="Accent — Blue">
          <TweakColor
            label="Secondary (blue)"
            value={tweaks.accent2}
            onChange={(v) => setTweaks({ accent2: v })}
          />
          <div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>
            {['#2e7bff', '#00b4ff', '#0066ff', '#4dd0ff', '#1e4fff'].map(c => (
              <button
                key={c}
                onClick={() => setTweaks({ accent2: c })}
                style={{ width: 22, height: 22, border: '1px solid #333', background: c, cursor: 'pointer' }}
              />
            ))}
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
