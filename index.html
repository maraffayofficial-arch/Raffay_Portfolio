<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Abdul Raffay — Cyberpunk Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #07070a; color: #ecedf2; font-family: 'Inter', system-ui, sans-serif; scroll-behavior: smooth; }
  body { overflow-x: hidden; }
  ::selection { background: #ff2e3e; color: #07070a; }

  /* custom scrollbar */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #07070a; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #ff2e3e, #2e7bff); border: 2px solid #07070a; }

  @keyframes hifi-rain { 0% { transform: translateY(0); } 100% { transform: translateY(200vh); } }
  @keyframes hifi-blink { 50% { opacity: 0; } }
  @keyframes hifi-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  @keyframes hifi-scroll-line { 0%, 100% { transform: scaleY(1); opacity: 0.4; } 50% { transform: scaleY(1.3); opacity: 1; } }

  a { outline: none; }
  button { outline: none; font-family: inherit; }

  /* section reveal */
  section { scroll-margin-top: 80px; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="hifi-core.jsx"></script>
<script type="text/babel" src="hifi-sections-a.jsx"></script>
<script type="text/babel" src="hifi-sections-b.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "animationIntensity": 1,
  "accentRed": "#ff2e3e",
  "accentBlue": "#2e7bff"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweaks] = useTweaks(TWEAK_DEFAULTS);
  const [active, setActive] = React.useState('home');

  React.useEffect(() => {
    document.documentElement.style.setProperty('--accent-red', tweaks.accentRed);
    document.documentElement.style.setProperty('--accent-blue', tweaks.accentBlue);
  }, [tweaks.accentRed, tweaks.accentBlue]);

  React.useEffect(() => {
    const opts = { rootMargin: '-40% 0px -55% 0px' };
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
    }, opts);
    document.querySelectorAll('section[id]').forEach(s => obs.observe(s));
    return () => obs.disconnect();
  }, []);

  const { Nav, Hero, About, Stack, Projects, Experience, Blog, ContactCTA, Footer } = window;

  return (
    <>
      <Nav active={active} />
      <Hero intensity={tweaks.animationIntensity} />
      <About />
      <Stack />
      <Projects />
      <Experience />
      <Blog />
      <ContactCTA />
      <Footer />

      <TweaksPanel title="Tweaks">
        <TweakSection title="Motion">
          <TweakRadio
            label="Animation intensity"
            value={tweaks.animationIntensity}
            onChange={(v) => setTweaks({ animationIntensity: Number(v) })}
            options={[
              { label: 'Off', value: 0 },
              { label: 'Subtle', value: 1 },
              { label: 'Heavy (rain + scanlines)', value: 2 },
            ]}
          />
        </TweakSection>
        <TweakSection title="Accents">
          <TweakColor label="Primary (red)" value={tweaks.accentRed} onChange={(v) => setTweaks({ accentRed: v })} />
          <TweakColor label="Secondary (blue)" value={tweaks.accentBlue} onChange={(v) => setTweaks({ accentBlue: v })} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
